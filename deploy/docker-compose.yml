# ROOMAX 운영 배포 — 서버 1대 (docker compose). 안내: deploy/README.md
#   cp .env.example .env   # 값 채우기
#   docker compose up -d --build
name: roomax

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: roomax
      POSTGRES_DB: roomax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣으세요}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomax -d roomax"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 포트를 밖으로 열지 않는다 (같은 네트워크의 api·backup 만 접속)

  api:
    build: ../backend
    image: roomax-api
    restart: unless-stopped
    env_file: .env
    environment: &api_env
      ROOMAX_ENV: production  # 위험한 설정이면 시작하지 않음 (app/config.py production_problems)
      ROOMAX_DATABASE_URL: postgresql+psycopg://roomax:${POSTGRES_PASSWORD}@db:5432/roomax
      ROOMAX_COOKIE_SECURE: "true"
      ROOMAX_APP_URL: https://${SITE_ADDRESS:?SITE_ADDRESS 를 .env 에 넣으세요}
      ROOMAX_CORS_ORIGINS: https://${SITE_ADDRESS}
      # 개인 사용(기본): 처음 한 명만 가입, 메일은 선택 (없으면 /data/mail_outbox 에 저장 + admin_cli reset-link)
      # 상용(누구나 가입): ROOMAX_SIGNUP_MODE=open + ROOMAX_MAIL_MODE=smtp
      ROOMAX_SIGNUP_MODE: ${ROOMAX_SIGNUP_MODE:-first_only}
      ROOMAX_OWNER_EMAIL: ${ROOMAX_OWNER_EMAIL:-}
      ROOMAX_MAIL_MODE: ${ROOMAX_MAIL_MODE:-file}
    volumes:
      - app_data:/data  # 암호화된 계약서 원본 · 복구 직전 안전 백업
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: ../frontend
    image: roomax-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 을 .env 에 넣으세요 (인증서 만료 안내 수신)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # 인증서 — 지우면 다시 발급 (발급 횟수 제한 주의)
      - caddy_config:/config
    depends_on:
      - web
      - api

  backup:
    image: roomax-api
    restart: unless-stopped
    env_file: .env
    environment: *api_env
    command: ["sh", "/app/scripts/backup_loop.sh"]
    volumes:
      - app_data:/data
      - backup_files:/backups  # 꺼내기: docker compose cp backup:/backups ./offsite — 외부 저장소로 한 번 더 복사할 것
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  app_data:
  backup_files:
  caddy_data:
  caddy_config:

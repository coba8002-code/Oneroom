name: DB migrate (Supabase)
# main 에 마이그레이션이 들어오면(또는 Actions 화면에서 수동 실행) Supabase DB 에 적용한다.
# 저장소 Settings → Secrets → Actions 에 ROOMAX_DATABASE_URL (Supabase 'Session pooler' 주소, 5432) 이 있어야 실행.
# 로그에는 주소·비밀번호가 나오지 않는다 (alembic 은 적용한 버전 이름만 출력).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/alembic/**"]

permissions:
  contents: read

concurrency: { group: db-migrate, cancel-in-progress: false }

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: alembic upgrade head
        env:
          ROOMAX_DATABASE_URL: ${{ secrets.ROOMAX_DATABASE_URL }}
        run: |
          if [ -z "$ROOMAX_DATABASE_URL" ]; then
            echo "ROOMAX_DATABASE_URL 시크릿이 없어 건너뜁니다 (Vercel·Supabase 를 쓰지 않으면 정상)"; exit 0
          fi
          alembic upgrade head
          alembic current

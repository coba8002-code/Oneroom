name: Android APK
# 안드로이드 설치 파일(APK)을 만든다 — Actions 탭에서 'Run workflow' 를 누르거나 android/ 를 바꿔 main 에 올리면 실행.
# 결과는 실행 화면의 Artifacts 에 'roomax-apk' 로 올라감. 서명 키는 저장소 Secrets 에만 둔다 (deploy/android-apk.md)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      # 서명 키가 없으면(다른 사람의 PR 등) 빌드만 확인하고 서명 안 된 APK 는 올리지 않음
      - name: 서명 키 준비
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/roomax-release.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: APK 만들기
        env:
          ROOMAX_KEYSTORE: ${{ steps.key.outputs.signed == 'true' && format('{0}/roomax-release.p12', runner.temp) || '' }}
          ROOMAX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ROOMAX_KEYSTORE" ] || unset ROOMAX_KEYSTORE ROOMAX_KEYSTORE_PASSWORD
          gradle --no-daemon assembleRelease
      - name: 키 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/roomax-release.p12"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed == 'true'
        with:
          name: roomax-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

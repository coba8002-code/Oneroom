# 일회용: 힉스필드에서 만든 앱 아이콘 시안 4장을 받아 이 브랜치에 올린다 (작업 환경에서 이미지 서버가 막혀 있어서).
# 아이콘을 고른 뒤 같은 PR 에서 이 파일과 시안 폴더를 지운다.
name: fetch icon drafts
on:
  push:
    branches: [ccr-2f244caa-39b71s]
    paths: [.github/workflows/fetch-icon-drafts.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p design/icon-drafts
          base=https://d8j0ntlcm91z4.cloudfront.net/user_3Fz3sq1AStEUF3hh0ccaQj3b9fU/hf_20261017_163826_
          n=1
          for id in 74b1996c-9b54-4571-9100-e61520cd7361 f982605b-d96b-41f8-9969-acce33b29f63 5efd3b43-e6da-47e0-98f6-7412cc7cc63c 5a09e4e3-b8c4-41d5-b0b8-05fb51aae569; do
            curl -fsSL -o "design/icon-drafts/draft-$n.png" "$base$id.png"
            n=$((n+1))
          done
          ls -la design/icon-drafts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/icon-drafts
          git commit -m "chore: 앱 아이콘 시안 4장 받기 (일회용)"
          git push

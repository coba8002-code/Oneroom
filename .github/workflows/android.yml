name: Android APK
# 입금 알림 전달 앱(android/)을 만들어 'roomax-alerts-apk' 로 올린다 — Actions 실행 화면 맨 아래에서 내려받기
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # 러너에 안드로이드 SDK 가 이미 있음 (ANDROID_HOME) — 빠진 플랫폼은 빌드가 받아 옴
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: roomax-alerts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # main 에 들어가면 고정 주소로 올린다: releases/download/android-latest/roomax-alerts.apk (화면 '입금 알림 자동 연결'의 링크)
  release:
    needs: apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: roomax-alerts-apk }
      - run: mv app-debug.apk roomax-alerts.apk
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest roomax-alerts.apk --target "$GITHUB_SHA" \
            --title "ROOMAX 입금 알림 (안드로이드)" --notes "main $GITHUB_SHA 에서 만든 APK. 은행 문자·앱 알림 중 '입금'만 ROOMAX 연결 주소로 보냅니다." --prerelease

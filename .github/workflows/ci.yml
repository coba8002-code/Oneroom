name: CI
# 코드를 올릴 때마다 백엔드 테스트·화면 타입 검사·빌드를 돌린다 (실패하면 PR 에 빨간 표시)
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt pyflakes
      - run: python -m pyflakes app tests api
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    # 실제 PostgreSQL + API + 화면을 띄워 브라우저로 핵심 흐름을 확인 (e2e/tests). 실패하면 스크린샷·trace 를 올림
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: roomax, POSTGRES_PASSWORD: roomax, POSTGRES_DB: roomax_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roomax" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROOMAX_DATABASE_URL: postgresql://roomax:roomax@127.0.0.1:5432/roomax_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "frontend/package-lock.json" }
      - run: npm ci && npm run build
        working-directory: frontend
        env: { ROOMAX_API_ORIGIN: "http://127.0.0.1:8000" }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-report, path: "e2e/playwright-report\ne2e/test-results", retention-days: 7 }
